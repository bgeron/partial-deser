[package]
name = "partial-deser"
version = "0.1.0"
edition = "2021"
description = "Deserialize with Serde from partial JSON and more"

[features]
default = ["rand", "serde_json", "tracing"]
serde_json = ["dep:serde_json"]
unstable = []

[dependencies]
insta = { version = "1.42.0", features = ["ron"] }
rand = { version = "0.8", optional = true }
serde = "1.0.215"
serde_json = { version = "1.0.133", optional = true}
serde_yaml = { version = "0.9", optional = true}
static_assertions = "1.1.0"
tap = "1.0.1"
thiserror = "2.0.3"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.26", features = ["derive"] }
erased-serde = "0.4.5"
futures = "0.3.31"
indexmap = { version = "2.7.0", features = ["serde"] }
interprocess = "2.2.2"
itertools = "0.13.0"
ron = "0.7"
serde = { version = "1", features = ["derive"]}
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.43.0", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
tracing-subscriber = "0.3"

[[test]]
name = "output"
required-features = ["serde_json", "unstable"]

[[example]]
name = "show-live"
required-features = ["serde_json", "tracing"]

[[example]]
name = "parse" # dummy
required-features = ["serde_json", "tracing"]

[[example]]
name = "ex1"
required-features = ["serde_json", "serde_yaml", "tracing", "unstable"]

[[example]]
name = "ex2"
required-features = ["serde_json", "tracing"]
